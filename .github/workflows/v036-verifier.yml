name: v0.36 frozen-result verifier

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-v036:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python verify_descriptor_tail_release_results.py
