name: v0.42 middle live-tail experiment

on:
  push:
    branches:
      - experiment/v0.42-middle-live-tail-evacuation
  pull_request:

jobs:
  verify-v042-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_middle_live_tail_evacuation -v
      - name: Run v0.42 middle live-tail evacuation experiment
        id: v042
        run: python run_middle_live_tail_evacuation_experiment.py
      - name: Upload v0.42 failure diagnostic
        if: ${{ failure() && steps.v042.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: v0.42-middle-live-tail-evacuation-diagnostic
          path: middle_live_tail_evacuation_diagnostic.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: v0.42-middle-live-tail-evacuation-results
          path: middle_live_tail_evacuation_results.json
          if-no-files-found: error
