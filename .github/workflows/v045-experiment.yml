name: v0.45 multiple-FREE bidirectional QUEUED experiment

on:
  push:
    branches:
      - experiment/v0.45-multi-free-bidirectional-queued
  pull_request:

concurrency:
  group: v045-experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-v045-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_multi_free_bidirectional_queued_retirement_descriptor -v
      - name: Run v0.45 composition experiment
        run: python run_multi_free_bidirectional_queued_retirement_descriptor_experiment.py
      - name: Upload v0.45 failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v0.45-multi-free-bidirectional-failure
          path: multi_free_bidirectional_queued_retirement_descriptor_results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v0.45-multi-free-bidirectional-results
          path: multi_free_bidirectional_queued_retirement_descriptor_results.json
          if-no-files-found: error
