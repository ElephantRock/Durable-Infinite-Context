name: v0.30 diagnostic

on:
  pull_request:

jobs:
  v030:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run v0.30 with captured diagnostics
        shell: bash
        run: |
          set -o pipefail
          python run_integrated_segmented_primary_experiment.py 2>&1 | tee v030-diagnostic.log
      - name: Upload v0.30 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.30-diagnostic
          path: v030-diagnostic.log
          if-no-files-found: error
