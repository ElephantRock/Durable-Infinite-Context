name: v0.31 experiment

on:
  push:
    branches: [main]
  pull_request:

jobs:
  v031:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python run_fixed_width_radix_node_experiment.py
      - run: python verify_fixed_width_radix_node_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: v0.31-fixed-width-radix-node-results
          path: fixed_width_radix_node_results.json
          if-no-files-found: error
