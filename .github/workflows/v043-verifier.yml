name: v0.43 canonical-result verifier

on:
  push:
    branches:
      - experiment/v0.43-physical-tail-predecessor-maintenance
  pull_request:

jobs:
  verify-v043:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python verify_deep_middle_live_tail_evacuation_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: v0.43-deep-middle-live-tail-canonical-results
          path: deep_middle_live_tail_evacuation_results.json
          if-no-files-found: error
