name: v0.38 canonical-result verifier

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-v038:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python verify_partial_tail_shrink_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: v0.38-partial-tail-shrink-results
          path: partial_tail_shrink_results.json
          if-no-files-found: error
