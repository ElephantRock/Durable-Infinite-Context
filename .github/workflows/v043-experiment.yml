name: v0.43 reverse-hop experiment

on:
  push:
    branches:
      - experiment/v0.43-physical-tail-predecessor-maintenance
  pull_request:

jobs:
  verify-v043-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_deep_middle_live_tail_evacuation -v
      - name: Run v0.43 reverse-hop experiment
        id: v043
        run: python run_deep_middle_live_tail_evacuation_experiment.py
      - name: Upload v0.43 failure diagnostic
        if: ${{ failure() && steps.v043.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: v0.43-reverse-hop-diagnostic
          path: deep_middle_live_tail_evacuation_diagnostic.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.43-deep-middle-live-tail-results
          path: deep_middle_live_tail_evacuation_results.json
          if-no-files-found: error
