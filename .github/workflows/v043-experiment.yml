name: v0.43 reverse-hop candidate

on:
  push:
    branches:
      - experiment/v0.43-physical-tail-predecessor-maintenance
  pull_request:

jobs:
  verify-v043-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_deep_middle_live_tail_evacuation -v
