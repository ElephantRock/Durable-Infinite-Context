name: v0.33 experiment

on:
  pull_request:

jobs:
  v033:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_aligned_generation_reclaiming_primary -v
      - run: python run_generation_boundary_reclamation_experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.33-generation-boundary-reclamation-results
          path: generation_boundary_reclamation_results.json
          if-no-files-found: warn
