name: v0.44 QUEUED predecessor experiment

on:
  push:
    branches:
      - experiment/v0.44-bidirectional-queued-predecessor
  pull_request:

jobs:
  verify-v044-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_bidirectional_queued_retirement_descriptor -v
