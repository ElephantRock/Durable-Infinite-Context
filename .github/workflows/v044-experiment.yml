name: v0.44 QUEUED predecessor experiment

on:
  push:
    branches:
      - experiment/v0.44-bidirectional-queued-predecessor
  pull_request:

jobs:
  verify-v044-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_bidirectional_queued_retirement_descriptor -v
      - name: Run v0.44 tagged QUEUED predecessor experiment
        run: python run_bidirectional_queued_retirement_descriptor_experiment.py
      - name: Upload v0.44 failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v0.44-bidirectional-queued-failure
          path: bidirectional_queued_retirement_descriptor_results.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v0.44-bidirectional-queued-results
          path: bidirectional_queued_retirement_descriptor_results.json
