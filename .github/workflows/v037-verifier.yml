name: v0.37 candidate-result evidence

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-v037:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run v0.37 segregated descriptor arena result
        run: python run_segregated_retirement_descriptor_experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: v0.37-segregated-retirement-descriptor-results
          path: segregated_retirement_descriptor_results.json
          if-no-files-found: error
