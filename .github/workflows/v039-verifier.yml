name: v0.39 canonical-result verifier

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-v039:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python verify_bidirectional_tail_unlink_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: v0.39-bidirectional-tail-unlink-results
          path: bidirectional_tail_unlink_results.json
          if-no-files-found: error
