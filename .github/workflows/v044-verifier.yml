name: v0.44 canonical-result verifier

on:
  push:
    branches:
      - experiment/v0.44-bidirectional-queued-predecessor
  pull_request:

jobs:
  verify-v044:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python verify_bidirectional_queued_retirement_descriptor_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: v0.44-bidirectional-queued-canonical-results
          path: bidirectional_queued_retirement_descriptor_results.json
          if-no-files-found: error
