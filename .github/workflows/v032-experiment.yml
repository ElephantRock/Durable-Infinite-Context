name: v0.32 experiment

on:
  pull_request:

jobs:
  v032:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_reclaiming_radix_primary -v
      - run: python run_retired_generation_reclamation_experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.32-retired-generation-reclamation-results
          path: retired_generation_reclamation_results.json
          if-no-files-found: warn
