name: v0.41 multiple-FREE live-tail experiment

on:
  push:
    branches:
      - experiment/v0.41-multi-free-live-tail-evacuation
  pull_request:

jobs:
  verify-v041-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_multi_free_live_tail_evacuation -v
      - name: Run v0.41 multiple-FREE live-tail evacuation experiment
        id: v041
        run: python run_multi_free_live_tail_evacuation_experiment.py
      - name: Upload v0.41 failure diagnostic
        if: ${{ failure() && steps.v041.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: v0.41-multi-free-live-tail-evacuation-diagnostic
          path: multi_free_live_tail_evacuation_diagnostic.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: v0.41-multi-free-live-tail-evacuation-results
          path: multi_free_live_tail_evacuation_results.json
          if-no-files-found: error
