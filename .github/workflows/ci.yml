name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_planner_experiment.py
      - run: python run_scalable_planner_experiment.py
      - run: python run_maintenance_experiment.py
      - run: python run_compositional_profile_experiment.py
      - run: python run_normalized_membership_experiment.py
      - run: python run_page_locality_experiment.py
      - run: python run_hash_resize_experiment.py
      - run: python run_incremental_hash_experiment.py
      - run: python run_bounded_placement_experiment.py
      - run: python run_bounded_escape_experiment.py
      - run: python run_rare_overflow_experiment.py
      - run: python run_durable_hybrid_experiment.py
      - run: python run_fixed_page_primary_experiment.py
      - run: python verify_scanfree_cascade_results.py
      - run: python verify_recovery_results.py
      - run: python verify_process_recovery_results.py
      - run: python verify_multi_intent_results.py
      - run: python verify_topology_results.py
      - run: python verify_growth_results.py
      - run: python verify_predicate_schema_results.py
      - run: python verify_subject_fanout_results.py
      - run: python verify_compositional_profile_results.py
      - run: python verify_normalized_membership_results.py
      - run: python verify_page_locality_results.py
      - run: python verify_hash_resize_results.py
      - run: python verify_incremental_hash_results.py
      - run: python verify_bounded_placement_results.py
      - run: python verify_bounded_escape_results.py
      - run: python verify_rare_overflow_results.py
      - run: python verify_durable_hybrid_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: v0.9-process-recovery-results
          path: process_recovery_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.10-multi-intent-results
          path: multi_intent_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.11-topology-results
          path: topology_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.12-growth-results
          path: growth_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.13-predicate-schema-results
          path: predicate_schema_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.14-subject-fanout-results
          path: subject_fanout_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.15-compositional-profile-results
          path: compositional_profile_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.16-normalized-membership-results
          path: normalized_membership_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.17-page-locality-results
          path: page_locality_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.18-hash-resize-results
          path: hash_resize_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.19-incremental-hash-results
          path: incremental_hash_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.20-bounded-placement-results
          path: bounded_placement_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.21-bounded-escape-results
          path: bounded_escape_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.22-rare-overflow-results
          path: rare_overflow_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.23-durable-hybrid-results
          path: durable_hybrid_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.24-fixed-page-primary-results
          path: fixed_page_primary_results.json
          if-no-files-found: error
