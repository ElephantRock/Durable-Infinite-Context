name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_planner_experiment.py
      - run: python run_scalable_planner_experiment.py
      - run: python run_maintenance_experiment.py
      - run: python verify_scanfree_cascade_results.py
      - run: python verify_recovery_results.py
      - run: python verify_process_recovery_results.py
      - run: python verify_multi_intent_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: v0.9-process-recovery-results
          path: process_recovery_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.10-multi-intent-results
          path: multi_intent_results.json
          if-no-files-found: error
