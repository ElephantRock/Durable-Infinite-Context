name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_planner_experiment.py
      - run: python run_scalable_planner_experiment.py
      - run: python run_maintenance_experiment.py
      - run: python run_compositional_profile_experiment.py
      - run: python run_normalized_membership_experiment.py
      - run: python run_page_locality_experiment.py
      - run: python run_hash_resize_experiment.py
      - run: python run_incremental_hash_experiment.py
      - run: python run_bounded_placement_experiment.py
      - run: python run_bounded_escape_experiment.py
      - run: python run_rare_overflow_experiment.py
      - run: python run_durable_hybrid_experiment.py
      - run: python run_fixed_page_primary_experiment.py
      - run: python run_cross_store_hybrid_experiment.py
      - run: python run_recovery_interruption_experiment.py
      - run: python run_persistence_fault_experiment.py
      - run: python run_lazy_generation_allocation_experiment.py
      - run: python run_segmented_extent_mapping_experiment.py
      - run: python run_integrated_segmented_primary_experiment.py
      - run: python run_fixed_width_radix_node_experiment.py
      - run: python run_retired_generation_reclamation_experiment.py
      - run: python run_generation_boundary_reclamation_experiment.py
      - run: python run_retirement_queue_experiment.py
      - name: Run v0.35 recyclable retirement descriptor experiment
        id: v035
        run: python run_recyclable_retirement_descriptor_experiment.py
      - name: Upload v0.35 failure diagnostic
        if: ${{ failure() && steps.v035.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: v0.35-recyclable-retirement-descriptor-diagnostic
          path: recyclable_retirement_descriptor_diagnostic.json
          if-no-files-found: error
      - name: Run v0.36 descriptor tail release experiment
        id: v036
        run: python run_descriptor_tail_release_experiment.py
      - name: Upload v0.36 failure diagnostic
        if: ${{ failure() && steps.v036.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: v0.36-descriptor-tail-release-diagnostic
          path: descriptor_tail_release_diagnostic.json
          if-no-files-found: error
      - name: Run v0.37 segregated retirement descriptor arena experiment
        id: v037
        run: python run_segregated_retirement_descriptor_experiment.py
      - name: Upload v0.37 failure diagnostic
        if: ${{ failure() && steps.v037.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: v0.37-segregated-retirement-descriptor-diagnostic
          path: segregated_retirement_descriptor_diagnostic.json
          if-no-files-found: error
      - run: python verify_scanfree_cascade_results.py
      - run: python verify_recovery_results.py
      - run: python verify_process_recovery_results.py
      - run: python verify_multi_intent_results.py
      - run: python verify_topology_results.py
      - run: python verify_growth_results.py
      - run: python verify_predicate_schema_results.py
      - run: python verify_subject_fanout_results.py
      - run: python verify_compositional_profile_results.py
      - run: python verify_normalized_membership_results.py
      - run: python verify_page_locality_results.py
      - run: python verify_hash_resize_results.py
      - run: python verify_incremental_hash_results.py
      - run: python verify_bounded_placement_results.py
      - run: python verify_bounded_escape_results.py
      - run: python verify_rare_overflow_results.py
      - run: python verify_durable_hybrid_results.py
      - run: python verify_fixed_page_primary_results.py
      - run: python verify_cross_store_hybrid_results.py
      - run: python verify_recovery_interruption_results.py
      - run: python verify_persistence_fault_results.py
      - run: python verify_lazy_generation_allocation_results.py
      - run: python verify_segmented_extent_mapping_results.py
      - run: python verify_integrated_segmented_primary_results.py
      - run: python verify_fixed_width_radix_node_results.py
      - run: python verify_retired_generation_reclamation_results.py
      - run: python verify_generation_boundary_reclamation_results.py
      - run: python verify_retirement_queue_results.py
      - run: python verify_recyclable_retirement_descriptor_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: v0.9-process-recovery-results
          path: process_recovery_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: v0.10-multi-intent-results
          path: multi_intent_results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
