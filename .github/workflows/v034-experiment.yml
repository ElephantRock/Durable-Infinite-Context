name: v0.34 experiment

on:
  pull_request:

permissions:
  contents: write

jobs:
  v034:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_queued_generation_reclaiming_primary -v
      - run: python run_retirement_queue_experiment.py
      - run: python verify_retirement_queue_results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.34-retirement-queue-results
          path: retirement_queue_results.json
          if-no-files-found: warn
      - name: Apply v0.34 README update
        run: |
          python tools/update_readme_v034.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: advance README to v0.34"
            git push origin HEAD:${{ github.head_ref }}
          fi
