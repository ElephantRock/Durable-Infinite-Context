name: v0.34 experiment

on:
  pull_request:

jobs:
  v034:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_queued_generation_reclaiming_primary -v
      - run: python run_retirement_queue_experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.34-retirement-queue-results
          path: retirement_queue_results.json
          if-no-files-found: warn
